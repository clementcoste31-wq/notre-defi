<body>
<header><h1>🏆 Notre Défi</h1><p>1 € réellement gagné ou économisé = 1 point pour celui qui réalise l’action.</p></header>
<div class="wrap">
<div id="authCard" class="card authcard">
  <h2>🔐 Connexion</h2>
  <p class="small">Connecte-toi pour retrouver Notre Défi sur ton téléphone.</p>
  <label>E-mail</label><input id="loginEmail" type="email" autocomplete="email">
  <label>Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password">
  <button onclick="login()">Se connecter</button>
  <div id="loginError" class="small" style="color:#991b1b;margin-top:8px"></div>
</div>
<div id="app" class="hidden">
<div class="authbar"><span class="authstatus" id="authStatus"></span><button class="logout" onclick="logout()">Déconnexion</button></div>
<div class="tabs" id="tabs">
<button data-tab="dashboard" onclick="show('dashboard')">🏠 Tableau de bord</button>
